<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RADIO UNAB — Cabina</title>
  <link rel="icon" href="/img/logo.jpg" type="image/jpeg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/locutor.css"/>
</head>
<body>

<div class="cabina">

  <!-- ══════════════════ HEADER ══════════════════ -->
  <header class="cab-header">
    <div class="cab-brand">
      <div class="cab-brand-icon">
        <svg viewBox="0 0 40 40" width="22" height="22" fill="none">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
          <path d="M14 20 Q20 8 26 20 Q20 32 14 20Z" fill="currentColor" opacity="0.8"/>
          <circle cx="20" cy="20" r="3" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <span class="cab-brand-name">RADIO UNAB</span>
        <span class="cab-brand-sub">Cabina de Control</span>
      </div>
    </div>

    <!-- Indicadores centrales -->
    <div class="cab-indicators">
      <div class="indicator" id="ind-cpu">
        <span class="ind-dot green"></span>
        <span>Sistema OK</span>
      </div>
      <div class="indicator">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" opacity="0.5">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        <span id="oyentes-count">0</span>
        <span>oyentes</span>
      </div>
    </div>

    <!-- Toggle EN VIVO -->
    <div class="cab-live">
      <label class="live-toggle" aria-label="Toggle En Vivo">
        <input type="checkbox" id="toggle-envivo" checked/>
        <div class="lt-track">
          <span class="lt-label-off">OFF</span>
          <span class="lt-thumb"></span>
          <span class="lt-label-on">LIVE</span>
        </div>
      </label>
      <span class="live-status" id="envivo-label">EN VIVO</span>
    </div>
  </header>

  <!-- ══════════════════ BODY ══════════════════ -->
  <div class="cab-body">

    <!-- ──────── COLUMNA IZQUIERDA ──────── -->
    <aside class="col-tools">

      <!-- Card: Reproductor -->
      <div class="tool-card">
        <div class="tc-header">
          <div class="tc-icon red">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
          </div>
          <span class="tc-title">Reproductor</span>
        </div>

        <div class="src-tabs" role="tablist">
          <button class="src-tab active" data-fuente="youtube" role="tab">YouTube</button>
          <button class="src-tab" data-fuente="stream" role="tab">Stream URL</button>
        </div>

        <div class="src-panel" id="panel-youtube">
          <div class="field-row">
            <input type="url" id="input-youtube" class="field" placeholder="https://youtube.com/watch?v=..."/>
            <button class="btn-acc" id="btn-cargar-yt">Cargar</button>
          </div>
          <div class="yt-box" id="yt-wrapper">
            <div class="yt-ph" id="yt-placeholder">
              <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" opacity="0.3"><path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
              <p>Pega un link de YouTube</p>
            </div>
            <iframe id="yt-iframe" width="100%" height="185" frameborder="0"
              allow="autoplay; encrypted-media" allowfullscreen
              style="display:none;border-radius:8px" title="YouTube"></iframe>
          </div>
        </div>

        <div class="src-panel hidden" id="panel-stream">
          <div class="field-row">
            <input type="url" id="input-stream" class="field" placeholder="https://stream.radio.com/live.mp3"/>
            <button class="btn-acc" id="btn-aplicar-stream">Enviar</button>
          </div>
          <p class="field-hint">Se enviará como fuente de audio a todos los oyentes.</p>
        </div>
      </div>

      <!-- Card: Canción actual -->
      <div class="tool-card">
        <div class="tc-header">
          <div class="tc-icon purple">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <span class="tc-title">Al Aire Ahora</span>
        </div>

        <div class="fields-stack">
          <div class="field-group">
            <label class="field-label" for="inp-programa">Programa</label>
            <input type="text" id="inp-programa" class="field" placeholder="Ej: Tarde Musical" value="Programa de la Tarde"/>
          </div>
          <div class="field-group">
            <label class="field-label" for="inp-cancion">Canción</label>
            <input type="text" id="inp-cancion" class="field" placeholder="Nombre de la canción"/>
          </div>
          <div class="field-group">
            <label class="field-label" for="inp-artista">Artista</label>
            <input type="text" id="inp-artista" class="field" placeholder="Nombre del artista"/>
          </div>
          <div class="field-group">
            <label class="field-label" for="inp-caratula">Carátula (URL imagen)</label>
            <input type="url" id="inp-caratula" class="field" placeholder="https://...jpg"/>
          </div>
          <button class="btn-primary" id="btn-actualizar-cancion">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            Enviar a oyentes
          </button>
        </div>
      </div>

      <!-- Card: Accesos rápidos -->
      <div class="tool-card">
        <div class="tc-header">
          <div class="tc-icon yellow">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
          </div>
          <span class="tc-title">Accesos Rápidos</span>
        </div>
        <div class="quick-grid">
          <button class="quick-btn" id="acc-pausa">⏸ Pausar YT</button>
          <button class="quick-btn" id="acc-silenciar">🔇 Silenciar</button>
          <button class="quick-btn" id="acc-limpiar-chat">🗑 Limpiar leídos</button>
          <button class="quick-btn" id="acc-avisar">📢 Corte comercial</button>
        </div>

        <!-- Botón de voz en vivo -->
        <button class="btn-voz" id="btn-voz">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
          </svg>
          <span id="btn-voz-txt">🎙️ Ir al Aire</span>
        </button>
      </div>

    </aside>

    <!-- ──────── COLUMNA DERECHA: Monitor ──────── -->
    <section class="col-monitor">

      <div class="mon-header">
        <div>
          <h2 class="mon-title">Monitor de Peticiones</h2>
          <p class="mon-sub">Chat en tiempo real con los oyentes</p>
        </div>
        <div class="filters">
          <button class="filter-btn active" data-filtro="todos">Todos</button>
          <button class="filter-btn" data-filtro="pendientes">Pendientes</button>
          <button class="filter-btn" data-filtro="completados">Leídos</button>
        </div>
      </div>

      <!-- Mensajes -->
      <div class="peticiones-container" id="peticiones-container" role="log" aria-live="polite"></div>

      <!-- Input del locutor -->
      <div class="loc-input-bar">
        <div class="loc-badge">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
          <span>Locutor</span>
        </div>
        <form id="form-locutor" autocomplete="off">
          <input type="text" id="input-locutor" class="field"
            placeholder="Escribe al aire… (visible para todos)"
            maxlength="300" aria-label="Mensaje del locutor"/>
          <button type="submit" class="btn-send" aria-label="Enviar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </form>
      </div>

    </section>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/locutor.js"></script>
</body>
</html>
