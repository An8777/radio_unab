<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RADIO UNAB — En Vivo</title>
  <link rel="stylesheet" href="css/oyente.css" />
</head>
<body>

  <div class="app-container">

    <!-- ────────── COLUMNA IZQUIERDA: Reproductor ────────── -->
    <section class="panel-radio" aria-label="Reproductor RADIO UNAB">

      <!-- Logo / carátula circular -->
      <div class="caratula-wrapper">
        <img
          id="img-caratula"
          src="https://placehold.co/300x300/0d0d14/e94560?text=RADIO+UNAB"
          alt="RADIO UNAB"
          class="caratula-img"
          id="img-caratula"
        />
        <div class="caratula-ring" id="caratula-ring"></div>
      </div>

      <!-- Nombre de la radio y programa -->
      <div class="info-radio">
        <h1 class="radio-nombre">RADIO UNAB</h1>
        <p class="programa-nombre" id="programa-nombre">Programa de la Tarde</p>
      </div>

      <!-- Canción / artista actuales -->
      <div class="info-cancion">
        <p class="cancion-nombre" id="cancion-nombre">Sin información</p>
        <p class="artista-nombre" id="artista-nombre"></p>
      </div>

      <!-- ═══ CONTROLES DEL REPRODUCTOR ═══ -->
      <div class="reproductor">

        <!-- Barra de volumen (arriba, igual que la imagen de referencia) -->
        <div class="vol-row">
          <!-- Icono mute -->
          <button class="btn-mute" id="btn-mute" aria-label="Silenciar">
            <svg id="icon-vol-on" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="icon-vol-off" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>

          <!-- Slider de volumen -->
          <div class="vol-track-wrapper">
            <input
              type="range"
              id="slider-volumen"
              min="0" max="100" step="1" value="100"
              class="slider-volumen"
              aria-label="Volumen"
            />
          </div>

          <!-- Porcentaje -->
          <span class="vol-pct" id="vol-pct">100%</span>

          <!-- Icono volumen alto (derecha) -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="icon-vol-max">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </div>

        <!-- Botones centrales: barras | Play/Pausa | EN VIVO -->
        <div class="ctrl-row">

          <!-- Indicador de barras animadas (solo cuando reproduce) -->
          <div class="audio-bars" id="audio-bars">
            <span></span><span></span><span></span><span></span><span></span>
          </div>

          <!-- Botón Play / Pausa principal -->
          <button class="btn-play" id="btn-play" aria-label="Play / Pausa">
            <!-- Icono Play -->
            <svg id="icon-play" viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <!-- Icono Pausa -->
            <svg id="icon-pause" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" style="display:none">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <!-- Badge EN VIVO -->
          <div class="badge-envivo" id="badge-envivo">
            <span class="dot-pulse"></span>
            <span class="envivo-txt">LIVE</span>
          </div>

        </div>

        <!-- Texto de estado debajo de los controles -->
        <p class="estado-txt" id="estado-txt">Haz clic en ▶ para escuchar</p>

      </div>
      <!-- ═══ FIN CONTROLES ═══ -->

      <!-- Contador de oyentes -->
      <div class="oyentes-info">
        <span>👥</span>
        <span id="oyentes-count">0</span>
        <span>oyentes conectados</span>
      </div>

      <!-- Contenedor donde YouTube IFrame API inyecta el iframe -->
      <div id="yt-player-container" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0;"></div>

    </section>

    <!-- ────────── COLUMNA DERECHA: Chat ────────── -->
    <section class="panel-chat" aria-label="Chat en Vivo">

      <header class="chat-header">
        <div>
          <h2 class="chat-title">💬 Chat en Vivo</h2>
          <p class="chat-subtitle">Pide tu canción o saluda</p>
        </div>
        <div class="user-badge">
          <span class="user-dot"></span>
          <span id="mi-apodo">Conectando...</span>
        </div>
      </header>

      <div class="mensajes-container" id="mensajes-container" role="log" aria-live="polite"></div>

      <form class="chat-form" id="chat-form" autocomplete="off">
        <input
          type="text"
          id="input-mensaje"
          placeholder="Pide una canción o escribe un mensaje..."
          maxlength="300"
          aria-label="Escribe tu mensaje"
          class="input-mensaje"
        />
        <button type="submit" class="btn-enviar" aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>

    </section>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/oyente.js"></script>
</body>
</html>
