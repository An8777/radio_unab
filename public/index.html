<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RADIO UNAB — En Vivo</title>
  <link rel="icon" href="/img/logo.jpg" type="image/jpeg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/oyente.css"/>
</head>
<body>

<div class="app">

  <!-- ══════════════════ PANEL RADIO ══════════════════ -->
  <aside class="radio-panel">

    <!-- Fondo animado de ondas -->
    <div class="wave-bg">
      <div class="wave w1"></div>
      <div class="wave w2"></div>
      <div class="wave w3"></div>
    </div>

    <!-- Logo de la radio -->
    <div class="station-brand">
      <div class="brand-logo">
        <svg viewBox="0 0 40 40" width="28" height="28" fill="none">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
          <path d="M14 20 Q20 8 26 20 Q20 32 14 20Z" fill="currentColor" opacity="0.8"/>
          <circle cx="20" cy="20" r="3" fill="currentColor"/>
        </svg>
        <span class="brand-name">RADIO UNAB</span>
      </div>
      <div class="live-pill" id="live-pill">
        <span class="live-dot"></span>
        <span>EN VIVO</span>
      </div>
    </div>

    <!-- Disco / Carátula -->
    <div class="disk-scene">
      <div class="disk-glow" id="disk-glow"></div>
      <div class="disk-wrap" id="disk-wrap">
        <img id="img-caratula"
          src="/img/logo.jpg"
          alt="UNAB RADIO" class="disk-img"/>
        <div class="disk-center"></div>
        <div class="disk-shine"></div>
      </div>
    </div>

    <!-- Info canción -->
    <div class="now-playing">
      <p class="np-label">REPRODUCIENDO AHORA</p>
      <h2 class="np-title" id="cancion-nombre">En Vivo</h2>
      <p class="np-artist" id="artista-nombre">—</p>
      <p class="np-show" id="programa-nombre">Programa de la Tarde</p>
    </div>

    <!-- Equalizer decorativo -->
    <div class="eq-bars" id="eq-bars">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <!-- Controles -->
    <div class="player-controls">

      <!-- Volumen -->
      <div class="vol-bar">
        <button class="vol-btn" id="btn-mute" aria-label="Mute">
          <svg id="icon-vol-on" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg id="icon-vol-off" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
        <input type="range" id="slider-volumen" min="0" max="100" step="1" value="100" class="vol-slider" aria-label="Volumen"/>
        <span class="vol-pct" id="vol-pct">100%</span>
      </div>

      <!-- Play / Pausa -->
      <button class="play-btn" id="btn-play" aria-label="Play/Pausa">
        <div class="play-btn-ring"></div>
        <svg id="icon-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="icon-pause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" style="display:none">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>

      <p class="estado-txt" id="estado-txt">Presiona ▶ para sintonizar</p>
    </div>

    <!-- Oyentes -->
    <div class="listeners-bar">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" opacity="0.5">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
      <span id="oyentes-count">0</span>
      <span>escuchando ahora</span>
    </div>

    <!-- Player YT oculto -->
    <div id="yt-player-container" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;bottom:0;left:0;"></div>

  </aside>

  <!-- ══════════════════ PANEL CHAT ══════════════════ -->
  <main class="chat-panel">

    <!-- Header chat -->
    <header class="chat-top">
      <div class="chat-top-left">
        <div class="chat-top-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
          </svg>
        </div>
        <div>
          <h1 class="chat-title">Chat en Vivo</h1>
          <p class="chat-sub">Pide tu canción o saluda al aire</p>
        </div>
      </div>
      <div class="user-chip">
        <span class="user-online-dot"></span>
        <span id="mi-apodo">Conectando...</span>
      </div>
    </header>

    <!-- Mensajes -->
    <div class="msgs" id="mensajes-container" role="log" aria-live="polite"></div>

    <!-- Input -->
    <div class="chat-bottom">
      <form class="chat-form" id="chat-form" autocomplete="off">
        <input type="text" id="input-mensaje" class="chat-input"
          placeholder="🎵  Escribe un mensaje o pide una canción..."
          maxlength="300" aria-label="Mensaje"/>
        <button type="submit" class="send-btn" aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
    </div>

  </main>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/oyente.js"></script>
</body>
</html>
